title: "gkgy·孪生日志"
description: "记录 AI、工程现场、软件工具与生活实践，把做过的事写成可复用的答案。"
url: "https://gkgy.github.io"
baseurl: ""
lang: "zh-CN"
timezone: "Asia/Shanghai"
author:
  name: "gkgy"
  email: "gkgy@qq.com"

permalink: /:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: gkgy

exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - drafts

github_username: gkgy
github_repository: "https://github.com/gkgy/gkgy.github.io"
