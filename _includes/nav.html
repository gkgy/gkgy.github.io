<header class="site-header">
  <div class="nav-shell">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首页">
      <span>{{ site.title }}</span>
    </a>
    <nav class="main-nav" aria-label="主要导航">
      <a href="{{ '/posts/' | relative_url }}"{% if page.nav == 'posts' %} aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/archive/' | relative_url }}"{% if page.nav == 'archive' %} aria-current="page"{% endif %}>归档</a>
      <a href="{{ '/search/' | relative_url }}"{% if page.nav == 'search' %} aria-current="page"{% endif %}>搜索</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.nav == 'tags' %} aria-current="page"{% endif %}>标签</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>关于</a>
      <a class="nav-publish" href="{{ '/publish/' | relative_url }}"{% if page.nav == 'publish' %} aria-current="page"{% endif %}>写文章</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
      <span class="theme-icon" aria-hidden="true">◐</span>
    </button>
  </div>
</header>
